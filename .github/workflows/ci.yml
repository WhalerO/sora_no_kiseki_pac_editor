name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-source-check:
    name: Windows / CPython 3.11
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: "."

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CPython 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-release.txt

      - name: Install validated dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Prepare pinned media runtime
        shell: pwsh
        run: ./scripts/prepare_vlc_runtime.ps1

      - name: Validate dependency and license closure
        run: |
          python -m pip check
          python scripts/collect_licenses.py .runtime/transient/ci-licenses --strict

      - name: Parse PowerShell release scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          foreach ($path in @(
            'scripts/build_exe.ps1',
            'scripts/prepare_vlc_runtime.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Check repository whitespace
        run: git diff --check

      # This checks source quality with synthetic fixtures. The separately
      # documented strict release profile also checks distribution review records.
      - name: Compile, test, and smoke-check
        run: python scripts/release_check.py
